<div
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 p-5"
>
  @for (house of houseService.houses(); track house.id; let i = $index) {
    <div
      class="card w-full shadow-lg h-100 bg-neutral text-neutral-content scale-100 hover:scale-102 transition-all duration-300"
    >
      <figure>
        <mini-map [center]="house.lngLat"></mini-map>
      </figure>
      <div class="card-body">
        <h2 class="card-title">
          {{ house.name }}

          @if (i === 0) {
            <div class="badge badge-secondary">NEW</div>
          }
        </h2>
        <p>{{ house.description }}</p>

        <div class="card-actions justify-start">
          <div class="badge badge-outline badge-primary">
            {{ house.price | currency }}
          </div>
        </div>

        <div class="card-actions justify-end">
          @for (tag of house.tags; track tag) {
            <div class="badge badge-outline">{{ tag }}</div>
          }
        </div>
      </div>
    </div>
  }
</div>
