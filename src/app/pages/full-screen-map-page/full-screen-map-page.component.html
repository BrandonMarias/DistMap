<div #mapContainer class="h-[60vh] sm:h-[90vh]">
  <google-map
    #map
    id="map"
    [center]="center()"
    [zoom]="zoom()"
    [options]="options()"
    [width]="'100vw'"
    [height]="'100%'"
    (zoomChanged)="zoomChanged()"
    (idle)="centerChanged()"
    (mapClick)="handleClick($event)"
  >
    @for (position of markersService.getMarkerPositions(); track $index) {
      <map-marker
        [position]="position"
        [options]="{ draggable: true }"
        [label]="$index | plusOne"
        (mapDragend)="handleDragEnd($event, $index)"
      />
    }

    <map-polyline
      [path]="markersService.getMarkerPositions()"
      [options]="{ strokeColor: 'red', strokeWeight: 5 }"
    />
  </google-map>
</div>

<section class="hidden sm:block card p-5 fixed bottom-15 left-2 shadow-2xl w-80 bg-base-100">
  <h2 class="text-2xl font-bold pb-5">
    Zoom
    <span class="text-2xl font-normal text-gray-100">{{ zoom() }}</span>

    <h3 class="text-sm font-bold pt-5">Coordinates</h3>
    <pre class="text-xs">{{
      {
        lat: currentCenter().lat | number: "1.4-4",
        lng: currentCenter().lng | number: "1.4-4",
      } | json
    }}</pre>
  </h2>

  <input
    type="range"
    min="1"
    max="22"
    [value]="zoom()"
    (input)="zoom.set(+zoomInput.value)"
    class="range range-secondary"
    #zoomInput
  />
</section>

@if (markersService.getMarkerPositions().length > 0) {
  <section
    class="card bg-base-100 p-5 sm:fixed sm:top-40 sm:left-2 shadow-2xl sm:w-80 w-full max-h-[32vh] sm:max-h-110 overflow-y-auto"
  >
    <markers-map
      (markSelected)="handleMarkSelected($event)"
      [markers]="markersService.getMarkerPositions()"
      (removeMarker)="handleRemoveMarker($event)"
      (removeAllMarkers)="handleRemoveAllMarkers()"
    />
  </section>
}

<section
  class="p-5 fixed top-13 right-20 cursor-pointer"
  (click)="handleMapShot()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
